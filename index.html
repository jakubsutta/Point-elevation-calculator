<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulačka nadmořské výšky</title>
  <meta name="description" content="Výpočet výšky vzdáleného bodu na základě známé nadmořské výšky, vzdálenosti a sklonu pro kanalizační projekty.">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">

  <!-- Styles -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="card" role="main">

  <!-- Header -->
  <div class="card-header">
    <div class="header-icon" aria-hidden="true"><i class="ph-bold ph-compass-tool"></i></div>
    <h1>Dopočet nadmořské výšky</h1>
    <p class="desc">Výpočet výšky vzdáleného bodu na základě známé výšky, vzdálenosti a sklonu (kanalizace).</p>
  </div>

  <!-- Two-column layout -->
  <div class="card-columns">

    <!-- LEFT: Inputs -->
    <div class="col-input">
      <div class="col-title">Vstupní údaje</div>

      <div class="form-group">
        <label for="h1">Známá nadmořská výška počátečního bodu</label>
        <input type="number" id="h1" class="form-control" step="any" placeholder="např. 300.200" autocomplete="off">
        <span class="unit-hint">m n. m.</span>
      </div>

      <div class="form-group">
        <label for="dist">Vzdálenost k druhému bodu</label>
        <input type="number" id="dist" class="form-control" step="any" placeholder="např. 21" autocomplete="off">
        <span class="unit-hint">metry</span>
      </div>

      <div class="form-group">
        <label for="slope">Sklon linie</label>
        <input type="number" id="slope" class="form-control" step="any" placeholder="např. 5" autocomplete="off">
        <span class="unit-hint">%</span>
      </div>

      <div class="form-group">
        <label>Směr sklonu</label>
        <div class="radio-group">
          <div class="radio-option">
            <input type="radio" name="direction" id="dir-klesa" value="klesa" checked>
            <label for="dir-klesa" class="radio-label">
              <span class="radio-icon" aria-hidden="true"><i class="ph-bold ph-arrow-down-right"></i></span> Klesá
            </label>
          </div>
          <div class="radio-option">
            <input type="radio" name="direction" id="dir-stoupa" value="stoupa">
            <label for="dir-stoupa" class="radio-label">
              <span class="radio-icon" aria-hidden="true"><i class="ph-bold ph-arrow-up-right"></i></span> Stoupá
            </label>
          </div>
        </div>
      </div>

      <button type="button" id="calcBtn" class="btn-primary">Vypočítat</button>
    </div>

    <!-- RIGHT: Result -->
    <div class="col-result">
      <div class="col-title">Výsledek</div>

      <!-- Empty state -->
      <div class="result-empty" id="resultEmpty">
        <div class="result-empty-icon" aria-hidden="true"><i class="ph ph-chart-bar"></i></div>
        <p>Vyplňte vstupní údaje a stiskněte <strong>Vypočítat</strong></p>
      </div>

      <!-- Filled result -->
      <div class="result" id="result"></div>
    </div>

  </div>

  <!-- Footer -->
  <div class="card-footer">
    <span class="copyright">© Jakub Šutta 2026</span>
    <a href="https://www.atomicon.cz" target="_blank" rel="noopener" class="btn-link">ATOMICON s.r.o.</a>
  </div>

</div>

<!-- Script -->
<script src="./js/app.js"></script>
</body>
</html>
