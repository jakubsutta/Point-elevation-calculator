<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ed804b"/>
      <stop offset="100%" stop-color="#b14305"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Compass tool icon (simplified) -->
  <!-- Pivot point -->
  <circle cx="16" cy="8.5" r="2.2" fill="none" stroke="white" stroke-width="2"/>
  <!-- Left leg -->
  <line x1="14.5" y1="10.5" x2="8" y2="26" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="17.5" y1="10.5" x2="24" y2="26" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Pencil tip on right leg -->
  <line x1="24" y1="26" x2="24" y2="22" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Arc drawn by compass -->
  <path d="M10 23 A10 10 0 0 1 22 23" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3"/>
</svg>
